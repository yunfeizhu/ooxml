name: Sync ooxml packages

# Reusable workflow: keeps a viewer repository on the latest `ooxml-core` and `ooxml-ui`.
# The viewers own only UI and bindings, so they must follow this repository's releases; doing it by
# hand is how they drift. A viewer calls this from a short scheduled workflow:
#
#   jobs:
#     sync:
#       uses: ChristopherVR/ooxml/.github/workflows/sync-ooxml.yml@main
#       permissions: { contents: write, issues: write }
#       secrets: inherit
#       with: { verify-command: 'bun run typecheck && bun run test' }
#
# A repository whose `main` requires a status check (a ruleset the default token cannot bypass) must
# give the caller a RELEASE_TOKEN secret: a fine-grained PAT with `Contents: Read and write`, owned
# by an admin on the ruleset's bypass list. Without it the push is rejected. A repository with no
# such rule needs no secret.
#
# It rewrites the manifests (scripts/sync-ooxml-deps.mjs), installs, runs `verify-command`, and
# pushes one `build(deps)` commit to main when everything passes. When verification fails it pushes
# nothing and opens (or comments on) one issue, so a breaking release is seen instead of silently
# left behind.

on:
  workflow_call:
    inputs:
      verify-command:
        description: 'Shell command that must pass before the bump is pushed'
        type: string
        default: 'bun run typecheck && bun run test'
      install-command:
        description: 'Command that refreshes the lockfile after the manifests change'
        type: string
        default: 'bun install'
      bun-version:
        type: string
        default: '1.4.2'
      node-version:
        type: string
        default: '24'
    secrets:
      RELEASE_TOKEN:
        description: 'Token that may push to a protected main; the default token is used without it'
        required: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the dependency bump
      issues: write # reports a failed verification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ChristopherVR/ooxml
          ref: main
          path: .ooxml-tooling
          sparse-checkout: scripts/sync-ooxml-deps.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Move manifests to the latest releases
        id: bump
        run: node .ooxml-tooling/scripts/sync-ooxml-deps.mjs

      - name: Install
        id: install
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        # The caller's command reaches bash through the environment, never pasted into the script.
        env:
          COMMAND: ${{ inputs.install-command }}
        run: |
          { bash -c "$COMMAND"; } 2>&1 | tee "$RUNNER_TEMP/install.log"

      - name: Verify
        id: verify
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        env:
          COMMAND: ${{ inputs.verify-command }}
        run: |
          { bash -c "$COMMAND"; } 2>&1 | tee "$RUNNER_TEMP/verify.log"

      - name: Push the bump
        if: steps.bump.outputs.changed == 'true' && steps.verify.outcome == 'success'
        env:
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.ooxml-tooling'
          git commit -m "build(deps): adopt $SUMMARY"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close resolved adoption issues
        if: steps.bump.outputs.changed == 'true' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          for n in $(gh issue list --state open --search "in:title Adopting" --json number,title \
            --jq '.[]|select(.title|endswith("fails verification") or endswith("could not be pushed"))|.number'); do
            gh issue close "$n" --comment "Superseded: $SUMMARY was adopted and verified." || true
          done

      - name: Report a failed bump
        if: failure() && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.bump.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          # Install and verify can fail on the bump itself. When both passed, the push was refused.
          if [ "$INSTALL_OUTCOME" = failure ]; then stage=install
          elif [ "$VERIFY_OUTCOME" = success ]; then stage=push
          else stage=verify; fi
          log_stage=$stage; [ "$stage" = push ] && log_stage=verify
          tail_text=$(tail -n 60 "$RUNNER_TEMP/$log_stage.log" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-300)
          if [ "$stage" = push ]; then
            title="Adopting $SUMMARY could not be pushed"
            lead="The checks for $SUMMARY passed, but the push to main was rejected, so nothing landed."
            hint='The repository rejected the push, usually because `main` requires a status check the default token cannot bypass. Give the repository a RELEASE_TOKEN secret and pass it with `secrets: inherit` (see the header of the reusable workflow in `ooxml`). The next scheduled run retries and closes this issue once the bump lands.'
          else
            title="Adopting $SUMMARY fails verification"
            lead="Bumping to $SUMMARY did not pass the repository checks (the **$stage** step failed), so nothing was pushed."
            hint='If the failure is in code that belongs in `ooxml`, fix it there and release first. The next scheduled run retries and closes this issue once the bump verifies.'
          fi
          body=$(printf '%s\n' \
            "$lead" \
            "" "Run: $RUN_URL" "" \
            "<details><summary>Last lines of the $log_stage output</summary>" "" \
            '```text' "$tail_text" '```' "" "</details>" "" \
            "$hint")
          existing=$(gh issue list --state open --search "in:title Adopting" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi
