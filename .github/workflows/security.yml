name: Security

# Alerts on risky changes before they merge and on a schedule afterwards. Findings appear on the
# PR (dependency review comments, CodeQL annotations on the diff) and in the repository's Security
# tab. Dependabot alerts and security updates are repository settings, not a workflow.
on:
  pull_request:
    paths:
      - 'bun.lock'
      - '**/package.json'
      - '.github/workflows/**'
      - 'src/**'
      - 'mcp/**'
      - 'apps/**'
      - 'viewers/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'mcp/**'
      - 'apps/**'
      - 'viewers/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '41 4 * * 1' # weekly: new advisories and new queries apply to unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fails a PR that adds a dependency with a known high-severity vulnerability, and comments a
  # summary on the PR when it does.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # On a PR, new alerts in the changed code are annotated on the diff (not a required check).
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          # Fixtures, generated output and the vendored demos are not our code.
          config: |
            paths-ignore:
              - '**/__fixtures__/**'
              - '**/fixtures/**'
              - '**/dist/**'
              - 'node_modules/**'
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:javascript-typescript
