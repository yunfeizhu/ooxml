name: Prune releases

# Release retention: keep only the newest version per published package
# (tagged `<npm-name>@x.y.z`) and delete the older GitHub Release entries, so
# the Releases page reads as a "current version of every package" list. Git
# tags are kept (opt in to deleting them via the `tags` input); npm versions
# are never touched. See scripts/prune-releases.mjs. The release workflow also
# prunes right after tagging; this scheduled run is the backstop.

on:
  schedule:
    # Daily, 04:30 UTC (releases run hourly once the schedule is enabled, so tags accumulate quickly).
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Number of newest releases to keep per package'
        required: false
        default: '1'
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        required: false
        default: false
      tags:
        description: "Also delete the pruned versions' git tags"
        type: boolean
        required: false
        default: false
      legacy:
        description: 'Also delete retired global v* releases/tags'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write # deletes release entries (and tags on request)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs reach the script through the environment, never pasted into it.
          KEEP: ${{ github.event.inputs.keep || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TAGS: ${{ github.event.inputs.tags }}
          LEGACY: ${{ github.event.inputs.legacy }}
        run: |
          keep="$KEEP"
          flags=""
          if [ "$DRY_RUN" = "true" ]; then
            flags="$flags --dry-run"
          fi
          if [ "$TAGS" = "true" ]; then
            flags="$flags --tags"
          fi
          if [ "$LEGACY" = "true" ]; then
            flags="$flags --legacy"
          fi
          node scripts/prune-releases.mjs --keep "$keep" $flags
