name: Deploy the site to GitHub Pages

# The integrated Office app and standalone PWAs share this build with viewer docs and demos.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'viewers/**'
      - 'demos/**'
      - 'apps/**'
      - 'scripts/build-pwa.mjs'
      - 'scripts/pwa/**'
      - 'e2e/**'
      - 'src/ui/**'
      - 'src/core/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/bundle-suite.mjs'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The demos resolve ooxml-ui, and through it ooxml-core, from their built output.
      - name: Build the core and the shared UI
        run: |
          bun run build
          bun run --cwd src/ui build
      - name: Build the site
        run: node scripts/build-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
