<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OpenTeams: React demo</title>
		<link rel="icon" href="data:," />
		<style>
			html,
			body,
			#root {
				margin: 0;
				height: 100%;
				font-family: system-ui, sans-serif;
			}
			.static-notice {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.4em 1em;
				padding: 0.55em 1em;
				font-size: 0.875rem;
				line-height: 1.45;
				background: #e6f4f4;
				color: #0b3d3d;
				border-bottom: 1px solid #b5dcdc;
			}
			.static-notice p {
				margin: 0;
				flex: 1 1 32em;
			}
			.static-notice a {
				color: #075e5e;
				font-weight: 600;
			}
			.static-notice button {
				font: inherit;
				background: none;
				border: 1px solid #8cc6c6;
				border-radius: 4px;
				color: inherit;
				padding: 0.15em 0.7em;
				cursor: pointer;
			}
			@media (prefers-color-scheme: dark) {
				.static-notice {
					background: #0f2e2e;
					color: #d5eeee;
					border-color: #1f5252;
				}
				.static-notice a {
					color: #7fd6d6;
				}
				.static-notice button {
					border-color: #2f6b6b;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
